name: Stale

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close inactive threads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: This issue has been inactive for 60 days. Comment to keep it open.
          stale-pr-message: This pull request has been inactive for 60 days. Comment to keep it open.
          close-issue-message: Closed after 14 days without activity.
          close-pr-message: Closed after 14 days without activity.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned
          exempt-all-milestones: true
