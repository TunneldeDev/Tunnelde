name: Public Windows installer upgrade

on:
  workflow_dispatch:
    inputs:
      from:
        description: Public source release tag
        default: v0.36.0
        required: true
        type: string
      to:
        description: Public target release tag
        default: v0.37.0
        required: true
        type: string
      check_cli:
        description: Verify the target installed desktop CLI (requires a release with CLI support)
        default: false
        required: false
        type: boolean
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/installer-upgrade.yml
      - scripts/qa/windows-upgrade/**
      - scripts/qa/local-cli/**

permissions:
  contents: read

concurrency:
  group: installer-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Public installer data retention
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned CDP client without browsers
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --prefix "$env:RUNNER_TEMP/upgrade-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Test release selection
        run: node --test scripts/qa/windows-upgrade/assets.test.mjs
      - name: Install old release, seed data, install new release and verify
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_FROM: ${{ inputs.from || 'v0.36.0' }}
          UPGRADE_TO: ${{ inputs.to || 'v0.37.0' }}
          UPGRADE_CHECK_CLI: ${{ inputs.check_cli && 'true' || 'false' }}
        run: node scripts/qa/windows-upgrade/run.mjs
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-upgrade
          path: ${{ runner.temp }}/tunnelde-upgrade/evidence
          if-no-files-found: warn
          retention-days: 14
