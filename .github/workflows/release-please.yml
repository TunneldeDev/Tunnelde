name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

jobs:
  release:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an unfinished draft
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const drafts = releases.filter(r => r.draft);
            core.setOutput('allowed', drafts.length === 0);
            if (drafts.length) core.notice(`Finish the existing draft before preparing another release: ${drafts.map(r => r.tag_name).join(', ')}`);
      - name: Create optional release App token
        if: steps.gate.outputs.allowed == 'true' && vars.RELEASE_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create draft for a merged release PR
        if: steps.gate.outputs.allowed == 'true'
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: main
          skip-github-pull-request: true
      - name: Create immutable source tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const {ensureDraftTag} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/automation.mjs`);
            await ensureDraftTag({github, context, tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA});
      - name: Maintain cumulative release PR
        if: steps.gate.outputs.allowed == 'true' && steps.release.outputs.release_created != 'true'
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: main
          skip-github-release: true
      - name: Preserve curated notes and run release PR checks
        if: steps.gate.outputs.allowed == 'true' && steps.release.outputs.release_created != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {updateReleasePr} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/automation.mjs`);
            await updateReleasePr({github, context});

  draft:
    name: Build draft release
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      existing_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
