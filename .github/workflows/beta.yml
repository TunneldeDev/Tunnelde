name: Prepare Beta

on:
  workflow_dispatch:

concurrency:
  group: beta-preparation
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  prepare:
    name: Tag selected development snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/github-script@v7
        with:
          script: |
            const {planDevelopment} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/planning/promotion.mjs`);
            const {prepareBeta} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/publishing/snapshots.mjs`);
            const plan = await planDevelopment({github, context});
            const tag = await prepareBeta({github, context, plan});
            if (!tag) { core.notice('No new Beta snapshot to publish.'); return; }
            // Tags created with GITHUB_TOKEN do not trigger push workflows.
            await github.rest.actions.createWorkflowDispatch({...context.repo,
              workflow_id: 'release-version.yml', ref: 'dev', inputs: {tag}});
