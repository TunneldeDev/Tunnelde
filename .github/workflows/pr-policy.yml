name: PR policy

on:
  pull_request_target:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

jobs:
  policy:
    name: Check title, commits and release policy
    runs-on: ubuntu-latest
    steps:
      # Never load or execute code from the PR in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'dev' }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {checkPullRequest, refreshReleasePolicy} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/automation.mjs`);
            if (context.eventName === 'pull_request_target') {
              await checkPullRequest({github, context, number: context.issue.number});
            } else {
              await refreshReleasePolicy({github, context});
            }
