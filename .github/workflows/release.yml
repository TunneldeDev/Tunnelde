name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      part:
        description: Semantic version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version (overrides part)
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    # The bot pushes the bump commit and its tag; that tag push must not build twice.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      body: ${{ steps.meta.outputs.body }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version, cut changelog and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_PART: ${{ inputs.part }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION}" ]; then
            node scripts/release/release.mjs --version "${RELEASE_VERSION}"
          else
            node scripts/release/release.mjs --part "${RELEASE_PART:-patch}"
          fi

          version=$(node scripts/release/version.mjs current)
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "tag v${version} already exists; delete the release and tag before re-dispatching" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json native-helpers/Cargo.toml native-helpers/Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${version}"
          git tag "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"

      - name: Verify tag against manifests
        if: github.event_name == 'push'
        run: node scripts/release/version.mjs check "${GITHUB_REF_NAME}"

      - name: Collect tag, version and release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version=$(node scripts/release/version.mjs current)
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          {
            echo "body<<RELEASE_NOTES"
            node scripts/release/changelog.mjs notes "${version}"
            echo "RELEASE_NOTES"
          } >> "${GITHUB_OUTPUT}"

      - name: Create shared draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" > releases.json
          count=$(jq --arg tag "${TAG}" '[.[][] | select(.tag_name == $tag)] | length' releases.json)
          if [ "${count}" -gt 1 ]; then
            echo "duplicate releases for ${TAG}; consolidate their assets before retrying" >&2
            exit 1
          elif [ "${count}" -eq 1 ]; then
            id=$(jq -er --arg tag "${TAG}" '.[][] | select(.tag_name == $tag and .draft == true) | .id' releases.json)
          else
            node scripts/release/changelog.mjs notes "${VERSION}" > release-notes.md
            jq -n --arg tag "${TAG}" --arg name "Tunnelde ${VERSION}" --rawfile body release-notes.md \
              '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:false}' > release.json
            id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input release.json --jq '.id')
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macOS 14 is being retired, and its brownouts abort release runs;
          # macos-15 is the current Apple Silicon image.
          - platform: macos-15
            args: "--target aarch64-apple-darwin"
          # Intel image; macos-13 is no longer available.
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: startsWith(matrix.platform, 'macos')
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Tunnelde ${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  helpers:
    name: Native helper ${{ matrix.asset }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x86_64
          - os: macos-15
            asset: macos-aarch64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-helpers
      - run: cargo test --locked --manifest-path native-helpers/Cargo.toml
      - run: cargo build --release --locked --manifest-path native-helpers/Cargo.toml
      - name: Package native helper and checksum
        env:
          HELPER_ASSET: ${{ matrix.asset }}
        run: node scripts/release/native-helper.mjs
      - name: Upload optional helper build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnelde-agent-${{ matrix.asset }}
          path: artifacts/helpers/*
          if-no-files-found: error
          retention-days: 30

  updater:
    name: Publish updater manifest
    needs: [prepare, build, helpers]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "${TAG}" --pattern "*.sig" --dir sigs --repo "${GITHUB_REPOSITORY}"

      - name: Build latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release/updater-json.mjs \
            --tag "${TAG}" \
            --sig-dir sigs \
            --repo "${GITHUB_REPOSITORY}" \
            --out latest.json

      - name: Upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Verify assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > assets.json
          node scripts/release/verify-assets.mjs --tag "${TAG}" --manifest latest.json --assets assets.json
          gh release edit "${TAG}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
