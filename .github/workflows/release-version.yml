name: Publish version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag to publish or recover
        required: true
        type: string

concurrency:
  group: version-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/github-script@v7
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const {prepareTaggedRelease} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/publishing/releases.mjs`);
            core.setOutput('tag', await prepareTaggedRelease({github, context, tag: process.env.RELEASE_TAG}));

  publish:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      existing_tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
