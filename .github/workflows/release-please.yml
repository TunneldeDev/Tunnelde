name: Stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const {prepareStable} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/publishing/stable.mjs`);
            const tag = await prepareStable({github, context});
            // Explicit dispatch is required for tags created by GITHUB_TOKEN.
            if (tag) await github.rest.actions.createWorkflowDispatch({...context.repo,
              workflow_id: 'release-version.yml', ref: 'dev', inputs: {tag}});

  refresh:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Refresh from authoritative dev/main refs after promotion, including new work accumulated during the build.
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'development.yml', ref: 'dev'});
