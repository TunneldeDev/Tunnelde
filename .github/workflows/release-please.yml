name: Stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const {prepareStable} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/automation.mjs`);
            core.setOutput('tag', await prepareStable({github, context}));

  publish:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      existing_tag: ${{ needs.prepare.outputs.tag }}
      build_helpers: false
    secrets: inherit

  refresh:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Refresh from authoritative dev/main refs after promotion, including new work accumulated during the build.
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'development.yml', ref: 'dev'});
