version: 2

# Major upgrades are reviewed by hand: the frontend toolchain, Tauri plugins and
# the bundled runtime move together, so an automatic major bump is rarely safe.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - typescript-eslint
          - eslint
          - eslint-plugin-*
          - prettier
          - vitest
          - "@testing-library/*"
          - jsdom

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # sysinfo bumps its MSRV in minor releases; pinned until the toolchain moves.
      - dependency-name: sysinfo
        update-types: ["version-update:semver-minor"]
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-*
      rust-runtime:
        patterns:
          - tokio
          - serde
          - serde_json
          - tracing
          - tracing-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
