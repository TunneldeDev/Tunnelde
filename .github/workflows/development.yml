name: Development

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: development-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  prepare:
    name: Maintain promotion PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const {planDevelopment, maintainReleasePr} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/planning/promotion.mjs`);
            const plan = await planDevelopment({github, context});
            const pr = await maintainReleasePr({github, context, plan});
            if (pr) core.notice(`Review release PR #${pr.number} at ${pr.sha}. If its pull_request CI awaits approval, approve that exact run from the PR Checks tab; a separate manual CI run does not release it.`);
