name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version manifests
        run: pnpm version:check

      - name: Test release automation
        run: node --test scripts/release/tests/*.test.mjs

      - name: Test plugin catalogue parity check
        run: node --test scripts/ci/*.test.mjs

      - name: Check translation catalogues
        run: pnpm i18n:check

      - name: Check public preference contracts
        run: node scripts/contracts/preferences/generate.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri

      - name: Install Linux build dependencies
        timeout-minutes: 14
        run: sudo "$(command -v node)" scripts/ci/linux/install-dependencies.mjs

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check stable plugin discovery contract
        run: |
          TUNNELDE_API_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-api-describe.json" cargo test --manifest-path src-tauri/Cargo.toml emit_discovery_contract_response
          node scripts/ci/check-plugin-contract.mjs "$RUNNER_TEMP/plugin-api-describe.json"
          TUNNELDE_EDITOR_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-editor.json" pnpm exec vitest run tests/app/pluginEditorContract.test.ts
          TUNNELDE_WORKSPACE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-workspace.json" pnpm exec vitest run tests/app/pluginWorkspaceContract.test.ts
          TUNNELDE_UI_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-ui.json" pnpm exec vitest run tests/app/pluginUiContract.test.ts
          TUNNELDE_EDITOR_CONTRACT_INPUT="$RUNNER_TEMP/plugin-editor.json" TUNNELDE_WORKSPACE_CONTRACT_INPUT="$RUNNER_TEMP/plugin-workspace.json" TUNNELDE_UI_CONTRACT_INPUT="$RUNNER_TEMP/plugin-ui.json" TUNNELDE_CORE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-core.json" cargo test --manifest-path src-tauri/Cargo.toml emit_core_contract_responses
          node scripts/ci/check-core-contract.mjs "$RUNNER_TEMP/plugin-api-describe.json" "$RUNNER_TEMP/plugin-core.json"
          node scripts/ci/check-legacy-sdk.mjs "$RUNNER_TEMP/plugin-core.json"

      - name: Check actual local automation API contracts
        run: |
          TUNNELDE_LOCAL_API_OUTPUT="$RUNNER_TEMP/local-api.json" cargo test --locked --manifest-path src-tauri/Cargo.toml --lib emit_actual_local_api_contracts
          node scripts/ci/check-local-api-contract.mjs "$RUNNER_TEMP/local-api.json"

      - name: Checkout SDK catalogue parser
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: d677bdb4ef814eac5210c23a7327271ab6e5ce30
          path: .sdk-parser
          persist-credentials: false

      - name: Compare SDK parser with host discovery
        run: node scripts/ci/check-sdk-parser.mjs . .sdk-parser "$RUNNER_TEMP/plugin-api-describe.json"

      - name: Checkout file content SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: bcc4a862de16d756ab2ad71e2b59656a3ac67c60
          path: .tmp/ci/file-content-consumer
          sparse-checkout: sdk
          persist-credentials: false

      - name: Check actual native file content against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_FILE_CONTENT_OUTPUT="$RUNNER_TEMP/plugin-file-content.json" cargo test --manifest-path src-tauri/Cargo.toml --lib emit_actual_file_content_contracts
          node scripts/ci/check-file-content-contract.mjs "$RUNNER_TEMP/plugin-file-content.json" .tmp/ci/file-content-consumer/sdk

      - name: Checkout profile metadata SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 0d19b67a6b8c4e1d275d3c938f47040250fdb04c
          path: .tmp/ci/profile-consumer
          persist-credentials: false

      - name: Checkout profile content SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 845a8d909f8fb0f058fd13eea032b3389204a222
          path: .tmp/ci/profile-content-consumer
          persist-credentials: false

      - name: Check actual large profile contents against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_PROFILE_CONTENT_OUTPUT="$RUNNER_TEMP/plugin-profile-content.json" cargo test --manifest-path src-tauri/Cargo.toml --lib large_public_body_emits_actual_segmented_sdk_interoperability_fixture
          node scripts/ci/check-profile-content.mjs "$RUNNER_TEMP/plugin-profile-content.json" .tmp/ci/profile-content-consumer/sdk

      - name: Checkout profile mutation SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: ed0fdb1ed918ce7434b3a0df7894fcf8c9384331
          path: .tmp/ci/profile-mutation-consumer
          sparse-checkout: sdk
          persist-credentials: false

      - name: Check actual profile mutations against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_PROFILE_MUTATION_OUTPUT="$RUNNER_TEMP/plugin-profile-mutations.json" cargo test --manifest-path src-tauri/Cargo.toml --lib emit_actual_public_profile_mutations_for_sdk
          node scripts/ci/check-profile-mutations.mjs "$RUNNER_TEMP/plugin-profile-mutations.json" .tmp/ci/profile-mutation-consumer/sdk

      - name: Check actual profile metadata against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_PROFILE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-profiles.json" cargo test --manifest-path src-tauri/Cargo.toml --lib maximum_metadata_fits_output_and_emits_real_protocol_fixtures
          node scripts/ci/check-profile-contract.mjs "$RUNNER_TEMP/plugin-profiles.json" .tmp/ci/profile-consumer/sdk

      - name: Checkout plugin storage SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: b640d22c177a71410ec69bcc08f6dc89a31f2f38
          path: .tmp/ci/storage-consumer
          persist-credentials: false

      - name: Check actual plugin storage against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_STORAGE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-storage.json" cargo test --manifest-path src-tauri/Cargo.toml --lib maximum_storage_and_unicode_emit_actual_sdk_interoperability_fixture
          node scripts/ci/check-storage-contract.mjs "$RUNNER_TEMP/plugin-storage.json" .tmp/ci/storage-consumer/sdk

      - name: Test current and historical plugin transports
        run: TUNNELDE_TEST_NODE="$(command -v node)" cargo test --manifest-path src-tauri/Cargo.toml talks_json_rpc_with_the_ -- --ignored

      - name: Checkout persisted log SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 8e67ccfa45003e5ccdc8246a44093684c1ac5b29
          path: .tmp/ci/logging-consumer
          persist-credentials: false

      - name: Check actual persisted logs against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_LOG_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-logs.json" cargo test --manifest-path src-tauri/Cargo.toml --lib emit_public_log_page_for_sdk
          node scripts/ci/check-logging-contract.mjs "$RUNNER_TEMP/plugin-logs.json" .tmp/ci/logging-consumer/sdk

      - name: Checkout host storage location SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 788266448f0e4cdb1c76e6383e805b0da1c49fde
          path: .tmp/ci/storage-locations-consumer
          persist-credentials: false

      - name: Check actual storage locations against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_LOCATION_CONTRACT_OUTPUT="$RUNNER_TEMP/host-storage-locations.json" cargo test --manifest-path src-tauri/Cargo.toml --lib emit_host_storage_location_contract
          node scripts/ci/check-storage-locations-contract.mjs "$RUNNER_TEMP/host-storage-locations.json" .tmp/ci/storage-locations-consumer/sdk

      # Recovery is a separate contract; retain the historical location consumer.
      - name: Checkout host storage recovery SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: d5a9f19d548af4ef7722f8ac69d4cdd5b5e08b0d
          path: .tmp/ci/storage-recovery-consumer
          persist-credentials: false

      - name: Check actual storage recovery against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_RECOVERY_CONTRACT_OUTPUT="$RUNNER_TEMP/host-storage-recovery.json" cargo test --manifest-path src-tauri/Cargo.toml --lib emit_host_storage_recovery_contract
          node scripts/ci/check-storage-recovery-contract.mjs "$RUNNER_TEMP/host-storage-recovery.json" .tmp/ci/storage-recovery-consumer/sdk

      - name: Checkout live file browser SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 380b292873fe682bb01694d201e9ba02522ee5f9
          path: .tmp/ci/file-browser-consumer
          persist-credentials: false

      - name: Check actual browser bridge against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_FILE_BROWSER_CONTRACT_OUTPUT="$RUNNER_TEMP/file-browser.json" pnpm exec vitest run tests/app/pluginFileBrowserContract.test.ts
          node scripts/ci/check-file-browser-contract.mjs "$RUNNER_TEMP/file-browser.json" .tmp/ci/file-browser-consumer/sdk

      - name: Checkout live preview SDK consumer
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: d5de592a48c474079491434244d97605827ead5e
          path: .tmp/ci/file-preview-consumer
          persist-credentials: false

      - name: Check actual preview bridge against schema and SDK
        timeout-minutes: 3
        run: |
          TUNNELDE_FILE_PREVIEW_CONTRACT_OUTPUT="$RUNNER_TEMP/file-preview.json" pnpm exec vitest run tests/app/pluginFilePreviewContract.test.ts
          node scripts/ci/check-file-preview-contract.mjs "$RUNNER_TEMP/file-preview.json" .tmp/ci/file-preview-consumer/sdk

      - name: Checkout cancellable transport SDK
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 404f019e0d3552358e5504b34b993573a6d22983
          path: .tmp/ci/cancellation-sdk
          persist-credentials: false

      - name: Check actual SDK cancellation against native request lifetime
        timeout-minutes: 3
        run: |
          TUNNELDE_TEST_NODE="$(command -v node)" TUNNELDE_TEST_CANCEL_SDK="$GITHUB_WORKSPACE/.tmp/ci/cancellation-sdk/sdk/tunnelde-plugin.mjs" cargo test --manifest-path src-tauri/Cargo.toml --lib current_sdk_control_frames_cancel_native_owned_futures_and_preserve_next_reply -- --ignored

      - name: Checkout current helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: 2020a1dd35d6c784e09e3ab0fdc71d6962a0ed04
          path: .tmp/ci/helper-current
          persist-credentials: false

      - name: Check current helper output against host decoder
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-current/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml current_selected_helper_discovery_matches_host_contract -- --ignored

      - name: Checkout initialized helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: 8119d0dbac1140b2a987b32df933d5c46a2425cd
          path: .tmp/ci/helper-initialized
          persist-credentials: false

      - name: Check initialized helper output against host negotiation
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-initialized/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml initialized_selected_helper_declares_supported_configuration -- --ignored
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml --lib historical_selected_helper_does_not_support_artifact_observation -- --ignored

      - name: Checkout fenced helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: dfc9e1b812992d850d5b6faa0abe1273cd26db2e
          path: .tmp/ci/helper-fenced
          persist-credentials: false

      - name: Check actual helper admission receipts against host recovery
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-fenced/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml selected_helper_admission_protocol_matches_host_contract -- --ignored

      - name: Checkout artifact observation helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: a43115649c730489ab635d2403fa7097ea1c480c
          path: .tmp/ci/helper-artifacts
          persist-credentials: false

      - name: Check actual helper artifact receipts against host recovery
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-artifacts/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml --lib selected_helper_artifact_protocol_matches_host_contract -- --ignored

      - name: Checkout native file-save helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: cb0d52789037a2aaf2dae2176a052a5895479a77
          path: .tmp/ci/helper-file-save
          persist-credentials: false

      - name: Check actual native saves against desktop transport and recovery decoder
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-file-save/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_FILE_SAVE_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml --lib selected_file_save_helper_executes_and_recovers_original_host_operations -- --ignored
          TUNNELDE_TEST_FILE_SAVE_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml --lib selected_file_save_helper_recovers_the_durable_service_without_replaying_content -- --ignored

      - name: Checkout historical helper protocol fixture
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-agent
          ref: a094e0341b9a7a131681041857014404008e0200
          path: .tmp/ci/helper-historical
          persist-credentials: false

      - name: Check historical helper rejection remains explicit
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path .tmp/ci/helper-historical/Cargo.toml --target-dir src-tauri/target
          TUNNELDE_TEST_RUNNER_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml historical_selected_helper_discovery_remains_unavailable -- --ignored
          TUNNELDE_TEST_FILE_SAVE_HELPER="$PWD/src-tauri/target/debug/tunnelde-agent" cargo test --manifest-path src-tauri/Cargo.toml --lib historical_file_save_helper_is_not_inferred_from_runner_capabilities -- --ignored

      - name: Test real SSHFS mount when FUSE is available
        run: |
          if [ -r /dev/fuse ] && [ -w /dev/fuse ]; then
            cargo test --manifest-path src-tauri/Cargo.toml real_passive_sshfs_mount_resolves_owned_files -- --ignored --nocapture
          else
            echo 'FUSE device unavailable on this runner; real SSHFS mount test skipped.'
          fi

  macos-app-check:
    name: macOS application check
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test macOS platform behavior
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test automation_cli
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::session
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::diagnostics
          cargo test --manifest-path src-tauri/Cargo.toml --lib services::files::read
          cargo test --manifest-path src-tauri/Cargo.toml --lib plugins::files::content
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::regular_file
          cargo test --manifest-path src-tauri/Cargo.toml --lib preview::
          cargo test --manifest-path src-tauri/Cargo.toml --lib plugins::api::domains::files::text
          cargo test --manifest-path src-tauri/Cargo.toml --lib logs::read
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::domains::logging
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::domains::forwarding
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::runtime
          cargo test --manifest-path src-tauri/Cargo.toml --lib services::settings
          cargo test --manifest-path src-tauri/Cargo.toml --lib settings_profiles
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_editor
          cargo test --manifest-path src-tauri/Cargo.toml --lib mac_mount_device_reports_existing_filesystem_and_rejects_missing_path
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::file_ops
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib move_verification
          cargo test --manifest-path src-tauri/Cargo.toml --lib backup_cleanup_preserves
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_transfer_commit_preserves
          cargo test --manifest-path src-tauri/Cargo.toml --lib transfer_artifact_
          cargo test --manifest-path src-tauri/Cargo.toml --lib interrupted_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::files::native_save
          cargo test --manifest-path src-tauri/Cargo.toml --lib storage::tests

  windows-app-check:
    name: Windows application check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test Windows file operations and guarded backup cleanup
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib network::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test automation_cli
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::session
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::diagnostics
          cargo test --manifest-path src-tauri/Cargo.toml --lib services::files::read
          cargo test --manifest-path src-tauri/Cargo.toml --lib plugins::files::content
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::regular_file
          cargo test --manifest-path src-tauri/Cargo.toml --lib preview::
          cargo test --manifest-path src-tauri/Cargo.toml --lib plugins::api::domains::files::text
          cargo test --manifest-path src-tauri/Cargo.toml --lib logs::read
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::domains::logging
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::domains::forwarding
          cargo test --manifest-path src-tauri/Cargo.toml --lib automation::runtime
          cargo test --manifest-path src-tauri/Cargo.toml --lib services::settings
          cargo test --manifest-path src-tauri/Cargo.toml --lib settings_profiles
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_editor
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::file_ops
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_directory_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib move_verification
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::guarded_file
          cargo test --manifest-path src-tauri/Cargo.toml --lib guarded_backup
          cargo test --manifest-path src-tauri/Cargo.toml --lib owned_backup_recovery
          cargo test --manifest-path src-tauri/Cargo.toml --lib interrupted_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib ssh::files::native_save
          cargo test --manifest-path src-tauri/Cargo.toml --lib storage::tests

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files
        run: bash scripts/ci/check-tree.sh
