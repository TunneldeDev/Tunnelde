name: Release

on:
  workflow_call:
    inputs:
      existing_tag:
        description: Immutable stable or beta draft tag to build and publish
        required: true
        type: string
      use_rust_cache:
        description: Restore Rust caches; disable when recovering a cache service outage
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Resume an existing draft release using its immutable source tag
        required: true
        type: string
      use_rust_cache:
        description: Restore Rust caches; disable to rebuild from source
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.existing_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      body: ${{ steps.meta.outputs.body }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Validate draft tag
        env:
          TAG: ${{ inputs.existing_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9])?$ ]]; then
            echo "existing_tag must be stable or beta.1–beta.9; Nightly publication is disabled" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.existing_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify immutable tag against manifests and channel history
        env:
          TAG: ${{ inputs.existing_tag }}
        run: |
          node scripts/release/version.mjs check "${TAG}"
          if [[ "${TAG}" == *-* ]]; then
            source=$(git show -s --format=%B HEAD | sed -n 's/^Release-source: //p')
            if [ -n "${source}" ]; then
              test "$(git rev-list --parents -n 1 HEAD | wc -w | xargs)" = "2"
              test "${source}" = "$(git rev-parse HEAD^)"
            else
              source=$(git rev-parse HEAD)
            fi
            git merge-base --is-ancestor "${source}" origin/dev
          else
            git merge-base --is-ancestor HEAD origin/main
          fi

      - name: Collect tag, version and release notes
        id: meta
        env:
          EXISTING_TAG: ${{ inputs.existing_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EXISTING_TAG}"
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          {
            echo "body<<RELEASE_NOTES"
            node scripts/release/changelog.mjs notes "${version}"
            echo "RELEASE_NOTES"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate and reuse the shared draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" > releases.json
          count=$(jq --arg tag "${TAG}" '[.[][] | select(.tag_name == $tag)] | length' releases.json)
          if [ "${count}" -ne 1 ]; then
            echo "Expected exactly one existing release draft for ${TAG}" >&2
            exit 1
          fi
          id=$(jq -er --arg tag "${TAG}" '.[][] | select(.tag_name == $tag and .draft == true) | .id' releases.json)
          source=$(jq -er --arg tag "${TAG}" '.[][] | select(.tag_name == $tag) | .target_commitish' releases.json)
          test "${source}" = "$(git rev-parse HEAD)"
          channel=false
          if [[ "${TAG}" == *-* ]]; then channel=true; fi
          jq -e --arg tag "${TAG}" --argjson channel "${channel}" '.[][] | select(.tag_name == $tag) | .prerelease == $channel' releases.json
          node scripts/release/changelog.mjs notes "${TAG#v}" > release-notes.md
          gh release edit "${TAG}" --notes-file release-notes.md --title "${TAG}" --repo "${GITHUB_REPOSITORY}"
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x86_64
            args: ""
          # Build both architectures on Intel to avoid arm64 runner shortages.
          - platform: macos-15-intel
            name: macos-aarch64
            target: aarch64-apple-darwin
            arch: arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            name: macos-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            name: linux-x86_64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Checkout current cache recovery tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          # Use Ubuntu's primary archive when the runner's Azure mirror stalls.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${sources}" ]; then
              sudo sed -i -E \
                -e 's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' \
                -e 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "${sources}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: startsWith(matrix.platform, 'macos')
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          # Apple Silicon requires a valid code signature, including cross builds.
          echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"

      - name: Cache Rust build
        if: inputs.use_rust_cache
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the existing cache namespace, independent of the calling job ID.
          shared-key: ${{ matrix.name }}-build
          cache-on-failure: true

      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node .release-tools/scripts/ci/reset-rust-cache.mjs src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Retry transient bundler-tool downloads and asset uploads without
          # repeating successful matrix jobs or changing the immutable tag.
          retryAttempts: 2
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          includeUpdaterJson: false
          # Tauri's default macOS updater archive names omit the version.
          assetNamePattern: ${{ startsWith(matrix.platform, 'macos') && '[name]_[version]_[arch][ext]' || '' }}
          args: ${{ matrix.args }} -- --locked --timings

      - name: Verify macOS executable architecture and signature
        if: startsWith(matrix.platform, 'macos')
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${TARGET}/release/bundle/macos/Tunnelde.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")
          test "$(lipo -archs "${app}/Contents/MacOS/${executable}")" = "${EXPECTED_ARCH}"
          codesign --verify --deep --strict --verbose=2 "${app}"

      - name: Upload compiler timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-timings-${{ matrix.name }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  updater:
    name: Verify and publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Checkout current release tooling for recovery of older tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "${TAG}" --pattern "*.sig" --dir sigs --repo "${GITHUB_REPOSITORY}"

      - name: Build latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release/changelog.mjs notes "${TAG#v}" > release-notes.md
          node .release-tools/scripts/release/updater-json.mjs \
            --tag "${TAG}" \
            --sig-dir sigs \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md \
            --out latest.json

      - name: Upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${TAG}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Verify complete desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > assets.json
          node .release-tools/scripts/release/verify-assets.mjs --tag "${TAG}" --manifest latest.json --assets assets.json
      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const {publishRelease} = await import(`${process.env.GITHUB_WORKSPACE}/.release-tools/scripts/release/publishing/releases.mjs`);
            await publishRelease({github, context, tag: process.env.RELEASE_TAG});
            await core.summary.addHeading(`Published ${process.env.RELEASE_TAG}`).addRaw('All desktop assets, signatures and updater metadata passed validation.').write();
