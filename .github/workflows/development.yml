name: Development

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: development-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  prepare:
    name: Maintain promotion PR and Nightly
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/github-script@v7
        id: release
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const {planDevelopment, maintainReleasePr, prepareNightly} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/automation.mjs`);
            const plan = await planDevelopment({github, context});
            await maintainReleasePr({github, context, plan});
            core.setOutput('tag', await prepareNightly({github, context, plan, runNumber: process.env.RUN_NUMBER, runAttempt: process.env.RUN_ATTEMPT}));

  nightly:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      existing_tag: ${{ needs.prepare.outputs.tag }}
      build_helpers: false
    secrets: inherit
