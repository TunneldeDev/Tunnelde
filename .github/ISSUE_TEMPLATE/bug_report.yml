name: Bug report
description: Report a problem with Tunnelde
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove hostnames, usernames and credentials from anything you paste.
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tunnelde version
      description: Shown in Settings and in the About tab.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (deb)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the log folder, with private data removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no credentials, private keys or personal data.
          required: true
