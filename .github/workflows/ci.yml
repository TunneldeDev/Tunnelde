name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version manifests
        run: pnpm version:check

      - name: Test release automation
        run: node --test scripts/release/tests/*.test.mjs

      - name: Check translation catalogues
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf sshfs openssh-sftp-server

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check stable plugin discovery contract
        run: |
          TUNNELDE_API_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-api-describe.json" cargo test --manifest-path src-tauri/Cargo.toml emit_discovery_contract_response
          node scripts/ci/check-plugin-contract.mjs "$RUNNER_TEMP/plugin-api-describe.json"

      - name: Test current and historical plugin transports
        run: TUNNELDE_TEST_NODE="$(command -v node)" cargo test --manifest-path src-tauri/Cargo.toml talks_json_rpc_with_the_ -- --ignored

      - name: Test real SSHFS mount when FUSE is available
        run: |
          if [ -r /dev/fuse ] && [ -w /dev/fuse ]; then
            cargo test --manifest-path src-tauri/Cargo.toml real_passive_sshfs_mount_resolves_owned_files -- --ignored --nocapture
          else
            echo 'FUSE device unavailable on this runner; real SSHFS mount test skipped.'
          fi

  macos-app-check:
    name: macOS application check
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: src-tauri
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib mac_mount_device_reports_existing_filesystem_and_rejects_missing_path

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files
        run: bash scripts/ci/check-tree.sh

  helpers:
    name: Native helpers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: native-helpers
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs native-helpers
      - run: cargo fmt --manifest-path native-helpers/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native-helpers/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path native-helpers/Cargo.toml --locked
      - run: cargo build --manifest-path native-helpers/Cargo.toml --locked
      - run: node --test native-helpers/tests/*.test.mjs
      - name: Check Apple Silicon cross compilation
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --manifest-path native-helpers/Cargo.toml --locked --target aarch64-apple-darwin
          test "$(lipo -archs native-helpers/target/aarch64-apple-darwin/debug/tunnelde-agent)" = arm64
