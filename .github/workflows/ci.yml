name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version manifests
        run: pnpm version:check

      - name: Test release automation
        run: node --test scripts/release/tests/*.test.mjs

      - name: Test plugin catalogue parity check
        run: node --test scripts/ci/*.test.mjs

      - name: Check translation catalogues
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri

      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          # Use Ubuntu's primary archive when the runner's Azure mirror stalls.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "${sources}" ]; then
              sudo sed -i -E \
                -e 's|mirror\+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' \
                -e 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "${sources}"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf sshfs openssh-sftp-server

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check stable plugin discovery contract
        run: |
          TUNNELDE_API_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-api-describe.json" cargo test --manifest-path src-tauri/Cargo.toml emit_discovery_contract_response
          node scripts/ci/check-plugin-contract.mjs "$RUNNER_TEMP/plugin-api-describe.json"
          TUNNELDE_EDITOR_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-editor.json" pnpm exec vitest run tests/app/pluginEditorContract.test.ts
          TUNNELDE_WORKSPACE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-workspace.json" pnpm exec vitest run tests/app/pluginWorkspaceContract.test.ts
          TUNNELDE_UI_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-ui.json" pnpm exec vitest run tests/app/pluginUiContract.test.ts
          TUNNELDE_EDITOR_CONTRACT_INPUT="$RUNNER_TEMP/plugin-editor.json" TUNNELDE_WORKSPACE_CONTRACT_INPUT="$RUNNER_TEMP/plugin-workspace.json" TUNNELDE_UI_CONTRACT_INPUT="$RUNNER_TEMP/plugin-ui.json" TUNNELDE_CORE_CONTRACT_OUTPUT="$RUNNER_TEMP/plugin-core.json" cargo test --manifest-path src-tauri/Cargo.toml emit_core_contract_responses
          node scripts/ci/check-core-contract.mjs "$RUNNER_TEMP/plugin-api-describe.json" "$RUNNER_TEMP/plugin-core.json"
          node scripts/ci/check-legacy-sdk.mjs "$RUNNER_TEMP/plugin-core.json"

      - name: Checkout SDK catalogue parser
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde-hub
          ref: 193ce451db4b318dd8d20080a094c7037a0734db
          path: .sdk-parser
          persist-credentials: false

      - name: Compare SDK parser with host discovery
        run: node scripts/ci/check-sdk-parser.mjs . .sdk-parser "$RUNNER_TEMP/plugin-api-describe.json"

      - name: Test current and historical plugin transports
        run: TUNNELDE_TEST_NODE="$(command -v node)" cargo test --manifest-path src-tauri/Cargo.toml talks_json_rpc_with_the_ -- --ignored

      - name: Test real SSHFS mount when FUSE is available
        run: |
          if [ -r /dev/fuse ] && [ -w /dev/fuse ]; then
            cargo test --manifest-path src-tauri/Cargo.toml real_passive_sshfs_mount_resolves_owned_files -- --ignored --nocapture
          else
            echo 'FUSE device unavailable on this runner; real SSHFS mount test skipped.'
          fi

  macos-app-check:
    name: macOS application check
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test macOS platform behavior
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib settings_profiles
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_editor
          cargo test --manifest-path src-tauri/Cargo.toml --lib mac_mount_device_reports_existing_filesystem_and_rejects_missing_path
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::file_ops
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib move_verification
          cargo test --manifest-path src-tauri/Cargo.toml --lib backup_cleanup_preserves
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_transfer_commit_preserves
          cargo test --manifest-path src-tauri/Cargo.toml --lib transfer_artifact_
          cargo test --manifest-path src-tauri/Cargo.toml --lib interrupted_move

  windows-app-check:
    name: Windows application check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        timeout-minutes: 3
        continue-on-error: true
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}
      - name: Discard incomplete Rust cache
        if: steps.rust-cache.outcome == 'failure'
        run: node scripts/ci/reset-rust-cache.mjs src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test Windows file operations and guarded backup cleanup
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib settings_profiles
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_editor
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::file_ops
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_directory_move
          cargo test --manifest-path src-tauri/Cargo.toml --lib move_verification
          cargo test --manifest-path src-tauri/Cargo.toml --lib platform::guarded_file
          cargo test --manifest-path src-tauri/Cargo.toml --lib guarded_backup
          cargo test --manifest-path src-tauri/Cargo.toml --lib owned_backup_recovery
          cargo test --manifest-path src-tauri/Cargo.toml --lib interrupted_move

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files
        run: bash scripts/ci/check-tree.sh
